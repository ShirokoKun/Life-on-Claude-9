<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>6:51 — a room at dawn</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: #dfe6ee; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0d10; transition: opacity .8s; z-index: 5; }
  #loading div { text-align: center; letter-spacing: .08em; font-size: 13px; opacity: .8; }
  #loading b { display: block; font-weight: 500; font-size: 30px; letter-spacing: .02em; margin-bottom: 10px; }
  #hint { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); font-size: 12.5px; letter-spacing: .06em; opacity: 0; transition: opacity .6s; text-shadow: 0 1px 8px #000a; white-space: nowrap; }
  #start { position: fixed; inset: 0; display: none; place-items: center; background: #06080bb0; pointer-events: auto; cursor: pointer; z-index: 4; }
  #start .card { text-align: center; }
  #start h1 { font-weight: 400; font-size: 54px; margin: 0 0 6px; letter-spacing: .01em; }
  #start p { margin: 4px 0; font-size: 13.5px; opacity: .78; letter-spacing: .05em; }
  #start .go { margin-top: 22px; display: inline-block; padding: 10px 22px; border: 1px solid #dfe6ee66; border-radius: 999px; font-size: 13px; letter-spacing: .12em; }
  body.shot #ui, body.shot #loading, body.shot #start { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hint">WASD move · mouse look · Shift walk slow · C cinematic · M mute · Esc release</div>
</div>
<div id="start"><div class="card"><h1>6:51</h1><p>a room at dawn</p><p class="go">CLICK TO ENTER</p></div></div>
<div id="loading"><div><b>6:51</b><span id="loadmsg">growing the room…</span></div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
