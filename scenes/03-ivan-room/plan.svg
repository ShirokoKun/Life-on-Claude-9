<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Segoe UI, sans-serif" font-size="11">
  <!-- 100 px = 1 m. Room 4.6 x 3.8 m; north (window wall) at the top. svg y = 80 + (3.8 - y)*100 -->
  <rect width="640" height="560" fill="#f4f1ea"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#222">Scene 3: Ivan's room, plan (my reading of the sketch)</text>
  <text x="20" y="46" fill="#666">4.6 × 3.8 m, ceiling 2.6 m · 1 square = 0.5 m · north = window wall</text>
  <!-- grid -->
  <g stroke="#e2ddd2" stroke-width="1">
    <path d="M60 80V460M110 80V460M160 80V460M210 80V460M260 80V460M310 80V460M360 80V460M410 80V460M460 80V460M510 80V460"/>
    <path d="M60 80H520M60 130H520M60 180H520M60 230H520M60 280H520M60 330H520M60 380H520M60 430H520"/>
  </g>
  <!-- rug -->
  <rect x="150" y="210" width="240" height="170" fill="#c9d0e0" stroke="#7d8bb0" stroke-dasharray="5 4"/>
  <text x="250" y="372" fill="#56628a">rug (navy)</text>
  <!-- walls -->
  <g fill="#333">
    <rect x="48" y="50" width="484" height="30"/>      <!-- north exterior wall 0.30 -->
    <rect x="48" y="80" width="12" height="392"/>      <!-- west -->
    <rect x="520" y="80" width="12" height="392"/>     <!-- east -->
    <rect x="48" y="460" width="484" height="12"/>     <!-- south -->
  </g>
  <!-- window opening -->
  <rect x="210" y="50" width="260" height="30" fill="#bcd4ee" stroke="#4a6fa0"/>
  <path d="M296.7 50V80M383.3 50V80" stroke="#4a6fa0"/>
  <text x="330" y="70" text-anchor="middle" fill="#1d3a66" font-weight="600">window 2.6 m · blinds · sill 0.82</text>
  <!-- door -->
  <rect x="120" y="458" width="90" height="16" fill="#f4f1ea"/>
  <path d="M120 460 L120 370 A90 90 0 0 1 210 460" fill="none" stroke="#999" stroke-dasharray="3 3"/>
  <line x1="120" y1="460" x2="120" y2="370" stroke="#555" stroke-width="3"/>
  <text x="128" y="452" fill="#555">door (in)</text>
  <!-- bed -->
  <rect x="60" y="125" width="200" height="140" fill="#9aa6c2" stroke="#3d4a6b"/>
  <rect x="66" y="135" width="40" height="120" rx="6" fill="#dfe3ec" stroke="#3d4a6b"/>
  <text x="140" y="200" fill="#1f2a44" font-weight="600">bed 2.0 × 1.4</text>
  <!-- nightstand + table lamp -->
  <rect x="60" y="80" width="50" height="45" fill="#8a5a3a" stroke="#4a2e1c"/>
  <circle cx="85" cy="102" r="11" fill="#ffc46b" stroke="#b07a1f"/>
  <text x="114" y="98" fill="#7a4a12">side desk + table lamp (warm)</text>
  <!-- main desk -->
  <rect x="275" y="80" width="190" height="65" fill="#8a5a3a" stroke="#4a2e1c"/>
  <rect x="420" y="82" width="43" height="61" fill="#74482c" stroke="#4a2e1c"/>
  <rect x="300" y="84" width="60" height="8" fill="#5b8cff"/><rect x="365" y="84" width="55" height="8" fill="#5b8cff"/>
  <text x="300" y="122" fill="#fff" font-weight="600">main desk 1.9</text>
  <text x="300" y="136" fill="#f2e3d4">2 monitors · laptop</text>
  <!-- chair + hoodie -->
  <g transform="rotate(-18 365 180)"><rect x="342" y="160" width="46" height="44" rx="6" fill="#3a3f4f" stroke="#111"/><rect x="342" y="198" width="46" height="9" fill="#222"/></g>
  <text x="330" y="222" fill="#333">chair + hoodie</text>
  <!-- bookshelf + guitar -->
  <rect x="485" y="100" width="35" height="120" fill="#6e4528" stroke="#3a2414"/>
  <text x="430" y="236" fill="#3a2414">bookshelf 2.0 h</text>
  <ellipse cx="470" cy="200" rx="12" ry="16" fill="#d9a35f" stroke="#7a4f1e"/>
  <text x="440" y="252" fill="#7a4f1e">guitar</text>
  <!-- floor lamp -->
  <circle cx="490" cy="88" r="5" fill="#333"/>
  <!-- east desk/shelf -->
  <rect x="480" y="270" width="40" height="80" fill="#8a5a3a" stroke="#4a2e1c"/>
  <text x="404" y="315" fill="#4a2e1c">desk/shelf</text>
  <!-- plant -->
  <circle cx="470" cy="410" r="24" fill="#5f8f55" stroke="#2f5a2a"/>
  <text x="430" y="447" fill="#2f5a2a">big plant</text>
  <!-- south low shelf -->
  <rect x="260" y="430" width="160" height="30" fill="#8a5a3a" stroke="#4a2e1c"/>
  <text x="272" y="449" fill="#fff">low shelf / table</text>
  <!-- hero camera -->
  <g transform="translate(330 415)">
    <path d="M0 0 L-103 -150 M0 0 L103 -150" stroke="#d1342f" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
    <rect x="-9" y="-6" width="18" height="12" fill="#d1342f"/>
  </g>
  <text x="340" y="400" fill="#d1342f" font-weight="600">hero cam 26 mm, z 1.3</text>
  <!-- outside -->
  <text x="20" y="500" fill="#4a6fa0">Outside (north, looking down a valley): trees 3–15 m → street lights 40–400 m → skyline 1–3 km → moonlit sky.</text>
  <text x="20" y="520" fill="#666">Lights: moon/city through the window (cool key) · table lamp (warm) · monitors + laptop (blue) · haze + window shafts.</text>
</svg>
